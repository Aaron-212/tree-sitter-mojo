[package]
name = "tree-sitter-mojo"
description = "Tree-Sitter of Mojolang"
version = "0.1.0"
authors = ["Aaron Ruan <i@ar212.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "mojo", "parsing", "tree-sitter"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/aaron-212/tree-sitter-mojo"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.26.9"

[build-dependencies]
cc = "1.2"
